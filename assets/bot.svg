<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img" aria-label="Illustration : commandes de modération, auto-modération anti-spam et journalisation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121821"/>
      <stop offset="100%" stop-color="#0d1219"/>
    </linearGradient>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    text{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace}
    .l{font-size:15px;fill:#c3cddb}
    .k{fill:#e2c98f}
    .d{fill:#6f7c8c;font-size:12.5px}
    .ok{fill:#7fb98a}
  </style>

  <rect width="560" height="330" fill="url(#bg)"/>
  <rect width="560" height="330" fill="url(#g)"/>

  <rect x="0" y="0" width="560" height="44" fill="#0b1016"/>
  <circle cx="24" cy="22" r="4.5" fill="#c9a96a"><animate attributeName="fill-opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="40" y="27" class="l k" font-size="14.5">modération</text>
  <text x="140" y="27" class="d">/help</text>
  <rect x="466" y="12" width="70" height="20" rx="10" fill="#7fb98a" fill-opacity="0.12" stroke="#7fb98a" stroke-opacity="0.5"/>
  <text x="501" y="26" text-anchor="middle" class="d ok">en ligne</text>

  <g>
    <text x="30" y="88" class="l"><tspan class="k">/ban</tspan> @membre  raison: publicité répétée</text>
    <text x="30" y="110" class="d">sanction appliquée · journal #mod-logs</text>
  </g>

  <g>
    <text x="30" y="152" class="l"><tspan class="k">auto-mod</tspan>  8 messages / 3 s détectés</text>
    <text x="30" y="174" class="d">mute temporaire 10 min · avertissement 1/3</text>
  </g>

  <g>
    <text x="30" y="216" class="l"><tspan class="k">/warn</tspan> @membre  raison: langage</text>
    <text x="30" y="238" class="d">avertissement 2/3 · notifié en message privé</text>
  </g>

  <g>
    <text x="30" y="280" class="l"><tspan class="k">/clear</tspan> 50</text>
    <text x="30" y="302" class="d">50 messages supprimés · action journalisée</text>
  </g>

  <rect x="0" y="0" width="0" height="0" fill="#222c39"/>
  
  <rect x="20" y="70" width="2" height="244" fill="#c9a96a" fill-opacity="0.45"/>
</svg>
