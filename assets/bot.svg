<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Illustration : commandes de modération, auto-modération anti-spam et journalisation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121821"/>
      <stop offset="100%" stop-color="#0d1219"/>
    </linearGradient>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    text{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace}
    .l{font-size:15.5px;fill:#c3cddb}
    .k{fill:#e2c98f}
    .d{fill:#6f7c8c;font-size:13px}
    .ok{fill:#7fb98a}
  </style>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#g)"/>

  <rect x="0" y="0" width="800" height="52" fill="#0b1016"/>
  <circle cx="30" cy="26" r="5" fill="#c9a96a"><animate attributeName="fill-opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="48" y="31" class="l k" font-size="15">modération</text>
  <text x="160" y="31" class="d">/help</text>
  <rect x="700" y="16" width="74" height="21" rx="10.5" fill="#7fb98a" fill-opacity="0.12" stroke="#7fb98a" stroke-opacity="0.5"/>
  <text x="737" y="31" text-anchor="middle" class="d ok">en ligne</text>

  <g>
    <text x="34" y="106" class="l"><tspan class="k">/ban</tspan> @membre  raison: publicité répétée</text>
    <text x="34" y="130" class="d">sanction appliquée · journal #mod-logs</text>
  </g>

  <g>
    <text x="34" y="182" class="l"><tspan class="k">auto-mod</tspan>  8 messages / 3 s détectés</text>
    <text x="34" y="206" class="d">mute temporaire 10 min · avertissement 1/3</text>
  </g>

  <g>
    <text x="34" y="258" class="l"><tspan class="k">/warn</tspan> @membre  raison: langage</text>
    <text x="34" y="282" class="d">avertissement 2/3 · notifié en message privé</text>
  </g>

  <g>
    <text x="34" y="334" class="l"><tspan class="k">/clear</tspan> 50</text>
    <text x="34" y="358" class="d">50 messages supprimés · action journalisée</text>
  </g>

  <rect x="34" y="392" width="732" height="1" fill="#222c39"/>
  <text x="34" y="420" class="d">discord.js · architecture événementielle · commandes slash</text>
  <rect x="24" y="86" width="2" height="290" fill="#c9a96a" fill-opacity="0.45"/>
</svg>
