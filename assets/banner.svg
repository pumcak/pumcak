<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Timéo Chabal, développement d'applications pour plateformes mobiles">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6f3c"/>
      <stop offset="50%" stop-color="#e2c98f"/>
      <stop offset="100%" stop-color="#8a6f3c"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a96a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff4dd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c9a96a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#c9a96a" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#c9a96a" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#c9a96a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="52%" stop-color="#f0dcae"/>
      <stop offset="100%" stop-color="#c9a96a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.79  0 0 0 0 0.66  0 0 0 0 0.42  0 0 0 0.55 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <clipPath id="rule-clip">
      <rect x="390" y="196" width="420" height="3" rx="1.5"/>
    </clipPath>
  </defs>

  <rect width="1200" height="340" fill="#0f141b"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#halo)"/>

  <!-- filets d'encadrement -->
  <rect x="24" y="24" width="1152" height="292" fill="none" stroke="#c9a96a" stroke-opacity="0.22" stroke-width="1"/>
  <path d="M24 24h64M24 24v48" fill="none" stroke="#c9a96a" stroke-opacity="0.75" stroke-width="2"/>
  <path d="M1176 316h-64M1176 316v-48" fill="none" stroke="#c9a96a" stroke-opacity="0.75" stroke-width="2"/>

  <text x="600" y="86" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace"
        font-size="14" letter-spacing="6.5" fill="#c9a96a" fill-opacity="0.92">
    BUT INFORMATIQUE · IUT CLERMONT AUVERGNE
  </text>

  <text x="600" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif"
        font-size="84" letter-spacing="3" fill="url(#name)" filter="url(#glow)">
    Timéo Chabal
  </text>

  <g clip-path="url(#rule-clip)">
    <rect x="390" y="196" width="420" height="3" rx="1.5" fill="url(#gold)"/>
    <rect x="-260" y="196" width="260" height="3" fill="url(#sweep)">
      <animate attributeName="x" values="330;810" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="17" fill="#c3cddb" text-anchor="middle">
    <text x="600" y="238">
      Développement d'applications pour plateformes mobiles
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.29;0.33;1" dur="13.5s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="238" opacity="0">
      C# · .NET MAUI · JavaScript · Node.js · C · SQL
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.62;0.66;1" dur="13.5s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="238" opacity="0">
      Des applications complètes, pas des exercices
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.69;0.95;0.99;1" dur="13.5s" begin="1s" repeatCount="indefinite"/>
    </text>
  </g>

  <g>
    <rect x="378" y="266" width="444" height="36" rx="18" fill="#c9a96a" fill-opacity="0.07" stroke="#c9a96a" stroke-opacity="0.45"/>
    <circle cx="404" cy="284" r="4" fill="#c9a96a">
      <animate attributeName="fill-opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;5.4;4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="424" y="290" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace"
          font-size="14.5" letter-spacing="0.4" fill="#e2c98f">
      Recherche un stage de 10 semaines · avril 2027
    </text>
  </g>
</svg>
